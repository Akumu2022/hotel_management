name: backend

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hotel
          POSTGRES_PASSWORD: hotel
          POSTGRES_DB: hotel
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hotel" --health-interval 2s --health-timeout 3s
          --health-retries 30
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://hotel:hotel@localhost:5432/hotel
      TEST_DATABASE_URL: postgresql+asyncpg://hotel:hotel@localhost:5432/hotel_test
      JWT_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install dependencies
        run: |
          python -c "import tomllib;d=tomllib.load(open('pyproject.toml','rb'))['project'];print('\n'.join(d['dependencies']+d['optional-dependencies']['dev']))" > /tmp/req.txt
          pip install -r /tmp/req.txt
      - run: ruff check . && ruff format --check .
      - name: Create test database
        run: PGPASSWORD=hotel psql -h localhost -U hotel -d hotel -c "CREATE DATABASE hotel_test"
      - name: Migrations up, down, up, no drift
        run: alembic upgrade head && alembic downgrade base && alembic upgrade head && alembic check
      - run: pytest -q
