# Serves the built web app and forwards /api and /media to the API container ("api:8000").
# Same origin for page and API, so the httpOnly login cookie (D29) works without CORS.
server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
    gzip_min_length 1000;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    client_max_body_size 12m; # rider ID photos, menu photos

    # Hashed build files never change: cache for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The service worker and app shell must always be fresh so updates reach phones.
    location = /sw.js { add_header Cache-Control "no-cache"; }
    location = /index.html { add_header Cache-Control "no-cache"; }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Live updates (Server-Sent Events): no buffering, long reads.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    # For uptime monitors: answers only while the API itself is up.
    location = /health {
        proxy_pass http://api:8000/health;
        access_log off;
    }

    # Menu photos are read straight from the shared media volume (no Python in the way). Their
    # file names are random and never reused, so browsers and the CDN may keep them for a year.
    # If a file is not on the volume (e.g. in development) the API is asked instead.
    location /media/ {
        alias /usr/share/nginx/media/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri @media_api;
    }
    location @media_api {
        proxy_pass http://api:8000;
        add_header Cache-Control "public, max-age=86400";
    }

    # Single-page app: every other path is the app.
    location / {
        try_files $uri /index.html;
    }
}
