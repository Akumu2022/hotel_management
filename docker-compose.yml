services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hotel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hotel}
      POSTGRES_DB: ${POSTGRES_DB:-hotel}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hotel}"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: ./backend
    # Bring the database up to date first, so new code never meets an old schema.
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --no-access-log --timeout-graceful-shutdown 3"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-hotel}:${POSTGRES_PASSWORD:-hotel}@db:5432/${POSTGRES_DB:-hotel}
      TEST_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-hotel}:${POSTGRES_PASSWORD:-hotel}@db:5432/hotel_test
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me-dev-secret-change-me}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      # D29: secrets stay on the server. Defaults are the development values; set real ones in .env.
      FORWARDER_KEY: ${FORWARDER_KEY:-dev-forwarder-key-change-me-dev-forwarder-key}
      APP_ENV: ${APP_ENV:-development}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      OSRM_URL: ${OSRM_URL:-https://router.project-osrm.org/route/v1/driving}
      REDIS_URL: ${REDIS_URL:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.com}
      PAYMENT_SIMULATOR: ${PAYMENT_SIMULATOR:-}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./web
    command: npm run dev -- --host 0.0.0.0
    environment:
      VITE_POLL: "1" # see web/vite.config.ts: pick up edits made on the host
    ports:
      - "5173:5173"
    volumes:
      - ./web:/app
      - /app/node_modules
    depends_on:
      - api

  # Optional: shared rate limits when the API runs as several processes. Start with
  #   docker compose --profile scale up -d redis   and set REDIS_URL=redis://redis:6379/0
  redis:
    profiles: ["scale"]
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no
    restart: unless-stopped

  # Optional: your own road-routing server (see README, "Road routing"). Start with
  #   docker compose --profile routing up -d osrm   and set OSRM_URL=http://osrm:5000/route/v1/driving
  osrm:
    profiles: ["routing"]
    image: ghcr.io/project-osrm/osrm-backend:latest
    command: osrm-routed --algorithm mld /data/kenya-latest.osrm
    volumes:
      - ./osrm-data:/data:ro
    restart: unless-stopped

volumes:
  pgdata: